<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}jobhunt{% endblock %}</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #262b36;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #5b9dff;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea;
      --text: #14171c; --muted: #5b6472; --accent: #1d5fd0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 72px; }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header a:hover { color: var(--text); }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 12px;
  }
  .row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  h2 { font-size: 15px; margin: 24px 0 10px; color: var(--muted);
       text-transform: uppercase; letter-spacing: 0.06em; }
  h3 { margin: 0 0 4px; font-size: 16px; }
  h3 a { color: var(--text); text-decoration: none; }
  h3 a:hover { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  .score {
    font-variant-numeric: tabular-nums; font-weight: 600; font-size: 20px;
    padding: 2px 10px; border-radius: 6px; white-space: nowrap;
  }
  .s-high { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
  .s-mid  { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .s-low  { color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .chip.on { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  .chip.off { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--muted); width: 120px; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; width: 70px; }
  textarea {
    width: 100%; min-height: 320px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    font: 14px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace; resize: vertical;
  }
  button, .btn {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    cursor: pointer; text-decoration: none; display: inline-block;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .jd {
    max-height: 420px; overflow-y: auto; white-space: pre-wrap;
    font-size: 14px; color: var(--muted); padding-right: 8px;
  }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .flag { color: var(--warn); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  @media (max-width: 640px) {
    .row { flex-direction: column; }
    td:first-child { width: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="/legacy" style="color:inherit;text-decoration:none">jobhunt</a></h1>
    <a href="/legacy">queue</a>
  </header>
  {% block content %}{% endblock %}
</div>
</body>
</html>
